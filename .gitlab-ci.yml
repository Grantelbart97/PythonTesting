stages:
  - lint
  - typechecking
  - test

variables:
  UV_CACHE_DIR: $CI_PROJECT_DIR/.uv-cache
  UV_COMPILE_BYTECODE: "1"
  UV_LINK_MODE: copy

default:
  interruptible: true
  cache:
    key:
      files:
        - uv.lock
    paths:
      - $UV_CACHE_DIR
  before_script:
    - uv sync --locked
  after_script:
    - uv cache prune --ci

ruff: 
  stage: lint
  tags: 
    - docker
  script: 
    - uv run ruff check

ruff-format:
  stage: lint
  tags: 
    - docker
  allow_failure: true
  script: 
    - uv run ruff format --check

ty: 
  stage: typechecking
  tags: 
    - docker
  script:
    - uv run ty check
    - uv run ty check --output-format=gitlab > gl-code-quality-report-ty.json || true
  artifacts:
    when: always
    reports:
      codequality: gl-code-quality-report-ty.json

pytest:
  stage: test
  tags: 
    - docker
  script:
    - uv run pytest --cov --cov-report=term --cov-report=xml:coverage.xml --junitxml=junit.xml
  coverage: '/^TOTAL.*\s+(\d+)%$/'
  artifacts:
    when: always
    paths:
      - junit.xml
      - coverage.xml
    reports:
      junit: junit.xml
      coverage_report:
        coverage_format: cobertura
        path: coverage.xml
